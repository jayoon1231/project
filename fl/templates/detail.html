<html lang="ko">
<head><meta charset="UTF-8"><title>{{ post.title }}</title></head>
<body>
    <a href="/">목록으로</a>
    <h1>{{ post.title }}</h1>
    <p>{{ post.content }}</p>
    <p>{{ post.created_at }}</p>
{% if session.get("user_id") == post.user_id %}
    <a href="/edit/{{ post.id }}">수정</a>
    <form method="post" action="/posts/{{ post.id }}/delete"style="display:inline;">
        <button type="submit">삭제</button>
    </form>
{% endif %}
</body>
    </html>
